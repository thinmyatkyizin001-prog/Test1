<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廢墟版活動報名平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>校園活動報名平台</h1>
  </header>

  <main class="container">
    <!-- 新增活動表單 -->
    <section class="card form-section">
      <h2>【新增活動】</h2>
      <form id="activity-form">
        <div class="form-group">
          <label for="act-name">活動名稱：</label>
          <input type="text" id="act-name" required placeholder="例如：校園園遊會">
        </div>
        <div class="form-group">
          <label for="act-date">活動日期：</label>
          <input type="date" id="act-date" required>
        </div>
        <div class="form-group">
          <label for="act-location">活動地點：</label>
          <input type="text" id="act-location" required placeholder="例如：學校操場">
        </div>
        <button type="submit" class="btn primary-btn">新增活動</button>
      </form>
    </section>

    <!-- 可報名活動清單 -->
    <section class="list-section">
      <h2>【可報名活動】</h2>
      <div id="activity-list" class="activity-grid"></div>
    </section>

    <!-- 報名彈窗 (Modal) -->
    <div id="signup-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title">活動報名</h3>
        <form id="signup-form">
          <input type="hidden" id="signup-act-id">
          <div class="form-group">
            <label for="user-name">您的姓名：</label>
            <input type="text" id="user-name" required placeholder="例如：王小明">
          </div>
          <div class="form-group">
            <label for="user-phone">聯絡電話：</label>
            <input type="tel" id="user-phone" required placeholder="例如：0912345678">
          </div>
          <div class="modal-buttons">
            <button type="button" class="btn cancel-btn" id="cancel-btn">取消</button>
            <button type="submit" class="btn primary-btn">確認報名</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
